# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Dependency Updates

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: windows-latest
    name: Update Dependencies

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Check for .NET updates
      id: dotnet-updates
      run: |
        cd backend
        
        # Check for outdated packages
        $outdated = dotnet list package --outdated --format json 2>$null | ConvertFrom-Json
        
        if ($outdated.projects) {
          $hasUpdates = $false
          foreach ($project in $outdated.projects) {
            if ($project.frameworks) {
              foreach ($framework in $project.frameworks) {
                if ($framework.topLevelPackages) {
                  $hasUpdates = $true
                  break
                }
              }
            }
          }
          
          if ($hasUpdates) {
            echo "has_updates=true" >> $env:GITHUB_OUTPUT
            Write-Host "Found .NET package updates available"
          } else {
            echo "has_updates=false" >> $env:GITHUB_OUTPUT
            Write-Host "No .NET package updates found"
          }
        } else {
          echo "has_updates=false" >> $env:GITHUB_OUTPUT
        }
      shell: powershell

    - name: Check for npm updates
      id: npm-updates
      run: |
        cd frontend
        
        # Check for outdated packages
        $npmCheck = npm outdated --json 2>$null
        
        if ($npmCheck -and $npmCheck -ne "{}") {
          echo "has_updates=true" >> $env:GITHUB_OUTPUT
          Write-Host "Found npm package updates available"
        } else {
          echo "has_updates=false" >> $env:GITHUB_OUTPUT
          Write-Host "No npm package updates found"
        }
      shell: powershell

    - name: Update .NET packages
      if: steps.dotnet-updates.outputs.has_updates == 'true'
      run: |
        cd backend
        
        # Update packages to latest versions
        dotnet list package --outdated | ForEach-Object {
          if ($_ -match '>\s+(\S+)\s+') {
            $packageName = $Matches[1]
            Write-Host "Updating package: $packageName"
            dotnet add package $packageName
          }
        }
      shell: powershell

    - name: Update npm packages
      if: steps.npm-updates.outputs.has_updates == 'true'
      run: |
        cd frontend
        
        # Update packages to latest versions
        npm update
        
        # Also update package-lock.json
        npm install
      shell: powershell

    - name: Test updated dependencies
      if: steps.dotnet-updates.outputs.has_updates == 'true' || steps.npm-updates.outputs.has_updates == 'true'
      run: |
        # Run a quick build test
        .\scripts\build-app.ps1 -Configuration Debug
      shell: powershell

    - name: Create Pull Request
      if: steps.dotnet-updates.outputs.has_updates == 'true' || steps.npm-updates.outputs.has_updates == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: 'chore: Automated dependency updates'
        body: |
          ## Automated Dependency Updates
          
          This PR contains automated updates to project dependencies.
          
          ### Changes
          
          #### .NET Packages
          ${{ steps.dotnet-updates.outputs.has_updates == 'true' && '✅ Updated to latest versions' || '❌ No updates available' }}
          
          #### npm Packages  
          ${{ steps.npm-updates.outputs.has_updates == 'true' && '✅ Updated to latest versions' || '❌ No updates available' }}
          
          ### Testing
          
          - ✅ Build test passed with updated dependencies
          - ⚠️ Please run full test suite before merging
          
          ### Notes
          
          - This PR was automatically created by the dependency update workflow
          - Review the changes carefully before merging
          - Consider any breaking changes in the updated packages
          
          ---
          
          *Auto-generated by GitHub Actions*
        branch: chore/dependency-updates
        delete-branch: true
        labels: |
          dependencies
          automated
        reviewers: |
          ${{ github.repository_owner }}

  security-audit:
    runs-on: windows-latest
    name: Security Audit

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Run npm audit
      working-directory: frontend
      run: |
        npm audit --audit-level=moderate
      continue-on-error: true

    - name: Run .NET security audit
      working-directory: backend
      run: |
        dotnet list package --vulnerable --include-transitive
      continue-on-error: true

    - name: Create security issue if vulnerabilities found
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = 'Security vulnerabilities detected in dependencies';
          const body = `## Security Alert
          
          Automated security audit has detected potential vulnerabilities in project dependencies.
          
          ### Action Required
          
          1. Review the workflow logs for details
          2. Update vulnerable packages
          3. Test the application thoroughly
          4. Close this issue once resolved
          
          ### Workflow Run
          
          [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ---
          
          *This issue was automatically created by the security audit workflow.*`;
          
          // Check if a similar issue already exists
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'security,automated'
          });
          
          const existingIssue = issues.find(issue => issue.title === title);
          
          if (!existingIssue) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'automated', 'bug']
            });
          }
