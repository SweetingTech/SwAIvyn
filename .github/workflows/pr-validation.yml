# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    name: Validate Pull Request

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: false
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Determine frontend lint targets
      id: frontend-lint-targets
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
        mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'frontend/*.js' 'frontend/*.jsx' 'frontend/*.ts' 'frontend/*.tsx' 'frontend/src/**/*.js' 'frontend/src/**/*.jsx' 'frontend/src/**/*.ts' 'frontend/src/**/*.tsx')
        if [ "${#files[@]}" -eq 0 ]; then
          echo "has_targets=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        printf 'targets<<EOF\n' >> "$GITHUB_OUTPUT"
        printf '%s\n' "${files[@]#frontend/}" >> "$GITHUB_OUTPUT"
        printf 'EOF\n' >> "$GITHUB_OUTPUT"
        echo "has_targets=true" >> "$GITHUB_OUTPUT"

    - name: Run frontend linting (changed files)
      if: steps.frontend-lint-targets.outputs.has_targets == 'true'
      working-directory: frontend
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t files <<'EOF'
        ${{ steps.frontend-lint-targets.outputs.targets }}
        EOF
        if [ "${#files[@]}" -gt 0 ]; then
          npx eslint "${files[@]}"
        fi

    - name: Skip frontend linting
      if: steps.frontend-lint-targets.outputs.has_targets != 'true'
      run: echo "No changed frontend source files to lint."


    - name: Check frontend build
      working-directory: frontend
      run: npm run build

    - name: Restore .NET dependencies
      working-directory: backend
      run: dotnet restore

    - name: Check backend build
      working-directory: backend
      run: dotnet build --configuration Release --no-restore

    - name: Run development setup (quick validation)
      run: |
        .\scripts\dev-setup.ps1
      shell: powershell

    - name: Validate build scripts
      run: |
        # Test that build script can be parsed (syntax check)
        try {
          $null = [ScriptBlock]::Create((Get-Content .\scripts\build-app.ps1 -Raw))
          $null = [ScriptBlock]::Create((Get-Content .\scripts\full-setup.ps1 -Raw))
          Write-Host "✓ Build scripts syntax validation passed" -ForegroundColor Green
        } catch {
          Write-Error "Build script syntax error: $_"
          exit 1
        }
      shell: powershell

    - name: Check for common issues
      run: |
        # Check for potential issues in the codebase
        $issues = @()
        
        # Check for hardcoded paths
        $hardcodedPaths = Select-String -Path "backend\*.cs" -Pattern "C:\\|D:\\|/Users/" -ErrorAction SilentlyContinue
        if ($hardcodedPaths) {
          $issues += "Found potential hardcoded paths in backend code"
        }
        
        # Check for missing files that the build depends on
        $requiredFiles = @(
          "backend\SwAIvyn.csproj",
          "frontend\package.json",
          "scripts\build-app.ps1"
        )
        
        foreach ($file in $requiredFiles) {
          if (-not (Test-Path $file)) {
            $issues += "Missing required file: $file"
          }
        }
        
        if ($issues.Count -gt 0) {
          Write-Warning "Found issues:"
          $issues | ForEach-Object { Write-Warning "- $_" }
          exit 1
        } else {
          Write-Host "✓ No common issues found" -ForegroundColor Green
        }
      shell: powershell

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('## PR Validation Results')
          );
          
          const body = `## PR Validation Results ✅
          
          The pull request has been validated successfully:
          
          - ✅ Frontend linting passed
          - ✅ Frontend build passed  
          - ✅ Backend build passed
          - ✅ Development setup validated
          - ✅ Build scripts syntax validated
          - ✅ No common issues detected
          
          The changes are ready for review!
          
          ---
          
          *This comment was automatically generated by the PR validation workflow.*`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
