repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend ESLint
        entry: npm run lint --prefix frontend
        language: system
        pass_filenames: false
        stages: [commit]
        additional_dependencies: []
