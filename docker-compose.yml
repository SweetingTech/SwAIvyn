services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - swai-network

  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Use SQLite in container; persist DB under /data
      ConnectionStrings__DefaultConnection: "Data Source=../data/swai-vyn.db"
      # Service-to-service URLs inside Docker network
      AppSettings__Neo4jEmbedded: "false"
      AppSettings__RequireNeo4j: "false"
      AppSettings__Neo4jUri: "http://neo4j:7474"
      AppSettings__Neo4jUser: "neo4j"
      AppSettings__Neo4jPassword: "${NEO4J_PASSWORD}"
      FishSpeech__BaseUrl: "http://tts:8081"
      AppSettings__WeaviateUrl: "http://weaviate:8080"
    ports:
      - "5000:8080"
    depends_on:
      neo4j:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      tts:
        condition: service_healthy
      stt:
        condition: service_healthy
    volumes:
      - ./data:/data
    networks:
      - swai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  swai-db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=swai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    volumes:
      - swai_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - swai-network

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - swai-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    environment:
      QUERY_DEFAULTS_LIMIT: '25'
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      LOG_LEVEL: 'info'
      LOG_FORMAT: 'text'
      CLUSTER_HOSTNAME: 'weaviate-node'
      CLUSTER_GOSSIP_BIND_PORT: '7946'
      CLUSTER_DATA_BIND_PORT: '7947'
      CLUSTER_JOIN: ''
    ports:
      - "8080:8080"
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - swai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  tts:
    build:
      context: .
      dockerfile: speech/TTS/openaudio-s1-mini/Dockerfile
    ports:
      - "8081:8081"
    networks:
      - swai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  stt:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      ASR_MODEL: tiny
    ports:
      - "9000:9000"
    networks:
      - swai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  swai-network:
    driver: bridge

volumes:
  swai_data:
    driver: local
  weaviate_data:
    driver: local
