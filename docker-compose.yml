services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - swai-network

  bff:
    build:
      context: ./services/bff
      dockerfile: Dockerfile
    environment:
      - TEMPORAL_HOST=temporal:7233
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - LMSTUDIO_HOST=${LMSTUDIO_HOST:-http://host.docker.internal:1234}
      - LLM_MODEL=${LLM_MODEL:-llama3}
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@swai-db:5432/swai
      - TTS_ADAPTER_URL=http://tts-11labs-adapter:8082
      - FISHSPEECH_URL=http://tts:8081
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES:-60}
    ports:
      - "5000:8080"
    depends_on:
      temporal:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    networks:
      - swai-network
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport sys, urllib.request\ntry:\n  with urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3) as r:\n    sys.exit(0 if r.status==200 else 1)\nexcept Exception:\n  sys.exit(1)\nPY\n"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    environment:
      - TEMPORAL_HOST=temporal:7233
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - LMSTUDIO_HOST=${LMSTUDIO_HOST:-http://host.docker.internal:1234}
      - LLM_MODEL=${LLM_MODEL:-llama3}
      - TTS_ADAPTER_URL=http://tts-11labs-adapter:8082
      - FISHSPEECH_URL=http://tts:8081
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ACTIVITY_THREADS=8
    depends_on:
      temporal:
        condition: service_started
    networks:
      - swai-network
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.23
    container_name: temporal
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=temporal
      - POSTGRES_SEEDS=swai-db
    ports:
      - "7233:7233"
    networks:
      swai-network:
        aliases:
          - temporal
    depends_on:
      swai-db:
        condition: service_healthy


  tts:
    build:
      context: .
      dockerfile: speech/TTS/openaudio-s1-mini/Dockerfile
    ports:
      - "8081:8081"
    networks:
      - swai-network
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport sys, urllib.request\ntry:\n  with urllib.request.urlopen('http://localhost:8081/health', timeout=3) as r:\n    sys.exit(0 if r.status==200 else 1)\nexcept Exception as e:\n  sys.exit(1)\nPY\n"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 20s

  tts-11labs-adapter:
    build:
      context: ./services/tts_11labs_adapter
      dockerfile: Dockerfile
    environment:
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    ports:
      - "8082:8082"
    networks:
      - swai-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - swai-network

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - neo4j_data:/data
    networks:
      - swai-network

  stt:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      - ASR_MODEL=tiny
    ports:
      - "9000:9000"
    networks:
      - swai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  swai-db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=swai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    volumes:
      - swai_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - swai-network

networks:
  swai-network:
    driver: bridge

volumes:
  qdrant_data: {}
  neo4j_data: {}
  swai_data: {}
