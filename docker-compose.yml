services:
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    environment:
      - TEMPORAL_HOST=temporal:7233
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - LMSTUDIO_HOST=${LMSTUDIO_HOST:-http://host.docker.internal:1234}
      - LLM_MODEL=${LLM_MODEL:-llama3}
      - FISHSPEECH_URL=${FISHSPEECH_URL:-http://tts:8081}
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ACTIVITY_THREADS=8
    depends_on:
      temporal:
        condition: service_started
    networks:
      - swai-network
    restart: unless-stopped
    profiles: ["orchestrator"]

  temporal:
    image: temporalio/auto-setup:1.23
    container_name: temporal
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=temporal
      - POSTGRES_SEEDS=swai-db
    ports:
      - "7233:7233"
    networks:
      swai-network:
        aliases:
          - temporal
    depends_on:
      swai-db:
        condition: service_healthy


  tts:
    build:
      context: .
      dockerfile: speech/TTS/openaudio-s1-mini/Dockerfile
    environment:
      - UPSTREAM_TTS=${UPSTREAM_TTS:-http://host.docker.internal:8081}
      - VOICES_DIR=/app/voices
    ports:
      - "8081:8081"
    volumes:
      - ./speech/TTS/openaudio-s1-mini/voices:/app/voices:ro
    networks:
      - swai-network
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport sys, urllib.request\ntry:\n  with urllib.request.urlopen('http://localhost:8081/health', timeout=3) as r:\n    sys.exit(0 if r.status==200 else 1)\nexcept Exception as e:\n  sys.exit(1)\nPY\n"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 20s
    profiles: ["tts"]


  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - swai-network

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - neo4j_data:/data
    networks:
      - swai-network

  stt:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      - ASR_MODEL=tiny
      - CUDA_VISIBLE_DEVICES=${STT_CUDA_VISIBLE_DEVICES:-0}
      - NVIDIA_VISIBLE_DEVICES=${STT_GPU_ID:-0}
      - NVIDIA_DRIVER_CAPABILITIES=all
    ports:
      - "9000:9000"
    networks:
      - swai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  swai-db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=swai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    volumes:
      - swai_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - swai-network

networks:
  swai-network:
    driver: bridge

volumes:
  qdrant_data: {}
  neo4j_data: {}
  swai_data: {}
