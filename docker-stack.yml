version: "3.8"

networks:
  default:
    driver: overlay
    attachable: true

volumes:
  qdrant_data: {}
  neo4j_data: {}
  swai_data: {}
  weaviate_data: {}
  weaviate_data_fresh: {}


services:
  traefik:
    image: traefik:v3.1
    command:
      - --log.level=INFO
      - --api.dashboard=true
      - --entrypoints.web.address=:80
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=swaivyn_default
      - --ping=true
      - --ping.entryPoint=web

    ports:
      - target: 80
        published: ${TRAEFIK_PORT:-80}
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - swai.service.name=traefik-proxy
        - swai.service.type=routing
        - swai.service.description=Reverse proxy and load balancer
        - traefik.enable=true
        - traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)
        - traefik.http.routers.dashboard.entrypoints=web
        - traefik.http.routers.dashboard.service=api@internal
        - traefik.http.services.swaivyn-traefik.loadbalancer.server.port=80




  tts:
    image: swai/tts-proxy:local
    environment:
      - UPSTREAM_TTS=${UPSTREAM_TTS:-http://host.docker.internal:8080}
      - VOICES_DIR=/app/voices
    volumes:
      - type: bind
        source: ${SWAI_ROOT_POSIX}
        target: /app/voices
        read_only: true
    networks:
      - default
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      labels:
        - swai.service.name=fish-speech-tts
        - swai.service.type=ai-audio
        - swai.service.description=Fish Speech text-to-speech service
        - traefik.enable=true
        - traefik.http.routers.tts.rule=Host(`tts.localhost`)
        - traefik.http.routers.tts.entrypoints=web
        - traefik.http.services.tts.loadbalancer.server.port=8081

  tts-11labs-adapter:
    image: swai/tts-11labs-adapter:local
    environment:
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    networks:
      - default
    ports:
      - target: 8082
        published: 8082
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      labels:
        - swai.service.name=elevenlabs-tts
        - swai.service.type=ai-audio
        - swai.service.description=ElevenLabs TTS adapter service
        - traefik.enable=true
        - traefik.http.routers.tts11.rule=Host(`elevenlabs.localhost`)
        - traefik.http.routers.tts11.entrypoints=web
        - traefik.http.services.tts11.loadbalancer.server.port=8082

  stt:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      - ASR_MODEL=tiny
      - CUDA_VISIBLE_DEVICES=${STT_CUDA_VISIBLE_DEVICES:-0}
      - NVIDIA_VISIBLE_DEVICES=${STT_GPU_ID:-0}
      - NVIDIA_DRIVER_CAPABILITIES=all
    networks:
      - default
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host
    deploy:
      labels:
        - swai.service.name=whisper-speech-to-text
        - swai.service.type=ai-audio
        - swai.service.description=OpenAI Whisper speech-to-text service
        - traefik.enable=true
        - traefik.http.routers.stt.rule=Host(`stt.localhost`)
        - traefik.http.routers.stt.entrypoints=web
        - traefik.http.services.stt.loadbalancer.server.port=9000

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - default
    ports:
      - target: 6333
        published: 6333
        protocol: tcp
        mode: host
    deploy:
      labels:
        - swai.service.name=qdrant-vector-db
        - swai.service.type=database
        - swai.service.description=Qdrant vector database for embeddings
        - traefik.enable=true
        - traefik.http.routers.qdrant.rule=Host(`qdrant.localhost`)
        - traefik.http.routers.qdrant.entrypoints=web
        - traefik.http.services.qdrant.loadbalancer.server.port=6333

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    networks:
      - default
    ports:
      - target: 7474
        published: 7474
        protocol: tcp
        mode: host
      - target: 7687
        published: 7687
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    deploy:
      labels:
        - swai.service.name=neo4j-graph-db
        - swai.service.type=database
        - swai.service.description=Neo4j graph database for relationships
        - traefik.enable=true
        - traefik.http.routers.neo4j.rule=Host(`graph.localhost`)
        - traefik.http.routers.neo4j.entrypoints=web
        - traefik.http.services.neo4j.loadbalancer.server.port=7474

  temporal:
    image: temporalio/auto-setup:1.23
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_SEEDS=swai-db

      - DB_HOST=swai-db
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=temporal
      # Ensure Temporal advertises a reachable address inside the overlay network
      - SERVICES__FRONTEND__PUBLIC_CLIENT__HOSTPORT=temporal:7233
    networks:
      - default
    ports:
      - target: 7233
        published: 7233
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 --namespace default || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 1m
      placement:
        constraints:
          - node.role == manager
      labels:
        - swai.service.name=temporal-workflow
        - swai.service.type=orchestration
        - swai.service.description=Temporal workflow orchestration engine
        - traefik.enable=true
        - traefik.http.routers.temporal.rule=Host(`temporal.localhost`)
        - traefik.http.routers.temporal.entrypoints=web
        - traefik.http.services.temporal.loadbalancer.server.port=7233
        - traefik.http.services.temporal.loadbalancer.server.scheme=h2c

  swai-db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=swai
    volumes:
      - swai_data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - swai-db
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swai"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      labels:
        - swai.service.name=postgresql-main-db
        - swai.service.type=database
        - swai.service.description=PostgreSQL main application database



  # Weaviate vector DB and inference modules
  weaviate:
    image: semitechnologies/weaviate:1.27.0
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=multi2vec-clip
      - ENABLE_MODULES=multi2vec-clip,qna-transformers,sum-transformers,text-spellcheck,reranker-transformers,backup-filesystem
      - CLUSTER_HOSTNAME=swaivyn-node1
      - RAFT_BOOTSTRAP_EXPECT=1

      - BACKUP_FILESYSTEM_PATH=/var/lib/weaviate/backups
      - CLIP_INFERENCE_API=http://multi2vec-clip:8080
      - QNA_INFERENCE_API=http://qna-transformers:8080
      - SUM_INFERENCE_API=http://sum-transformers:8080
      - SPELLCHECK_INFERENCE_API=http://text-spellcheck:8080
      - RERANKER_INFERENCE_API=http://reranker-transformers:8080
    volumes:
      - weaviate_data_fresh:/var/lib/weaviate
    networks:
      - default
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready || curl -fsS http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      labels:
        - swai.service.name=weaviate-vector-db
        - swai.service.type=database
        - swai.service.description=Weaviate vector database with AI modules
        - traefik.enable=true
        - traefik.http.routers.weav.rule=Host(`weaviate.localhost`)
        - traefik.http.routers.weav.entrypoints=web
        - traefik.http.services.weav.loadbalancer.server.port=8080

  multi2vec-clip:
    image: semitechnologies/multi2vec-clip:sentence-transformers-clip-ViT-B-32-multilingual-v1
    environment:
      - ENABLE_CUDA=0
    networks:
      - default
    deploy:
      labels:
        - swai.service.name=clip-embeddings
        - swai.service.type=ai-transformer
        - swai.service.description=CLIP multimodal embeddings model

  qna-transformers:
    image: semitechnologies/qna-transformers:distilbert-base-uncased-distilled-squad
    environment:
      - ENABLE_CUDA=0
    networks:
      - default
    deploy:
      labels:
        - swai.service.name=question-answering
        - swai.service.type=ai-transformer
        - swai.service.description=DistilBERT question answering model

  sum-transformers:
    image: semitechnologies/sum-transformers:facebook-bart-large-cnn-1.0.0
    environment:
      - ENABLE_CUDA=0
    networks:
      - default
    deploy:
      labels:
        - swai.service.name=text-summarization
        - swai.service.type=ai-transformer
        - swai.service.description=BART text summarization model

  text-spellcheck:
    image: semitechnologies/text-spellcheck-model:pyspellchecker-en
    networks:
      - default
    deploy:
      labels:
        - swai.service.name=spell-checker
        - swai.service.type=ai-transformer
        - swai.service.description=Text spell checking service

  reranker-transformers:
    image: semitechnologies/reranker-transformers:cross-encoder-ms-marco-MiniLM-L-6-v2
    environment:
      - ENABLE_CUDA=0
    networks:
      - default
    deploy:
      labels:
        - swai.service.name=text-reranker
        - swai.service.type=ai-transformer
        - swai.service.description=Text reranking model for search results

