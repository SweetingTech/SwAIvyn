version: '3.4'

services:
  weaviate-djay:
    image: semitechnologies/weaviate:1.27.0
    container_name: weaviate-djay
    command:
      - --host
      - '0.0.0.0'
      - --port
      - '8080'
      - --scheme
      - 'http'
    environment:
      QUERY_DEFAULTS_LIMIT: '25'
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'multi2vec-clip'
      ENABLE_MODULES: 'multi2vec-clip,qna-transformers,sum-transformers,text-spellcheck,reranker-transformers,backup-filesystem'
      CLUSTER_HOSTNAME: 'djay-node1'
      BACKUP_FILESYSTEM_PATH: '/var/lib/weaviate/backups'
      CLIP_INFERENCE_API: 'http://multi2vec-clip-djay:8080'
      QNA_INFERENCE_API: 'http://qna-transformers-djay:8080'
      SUM_INFERENCE_API: 'http://sum-transformers-djay:8080'
      SPELLCHECK_INFERENCE_API: 'http://text-spellcheck-djay:8080'
      RERANKER_INFERENCE_API: 'http://reranker-transformers-djay:8080'
    ports:
      - '8080:8080'
    volumes:
      - './weaviate_data_djay:/var/lib/weaviate'
    restart: on-failure:0
    depends_on:
      - multi2vec-clip-djay
      - qna-transformers-djay
      - sum-transformers-djay
      - text-spellcheck-djay
      - reranker-transformers-djay

  multi2vec-clip-djay:
    image: semitechnologies/multi2vec-clip:sentence-transformers-clip-ViT-B-32-multilingual-v1
    container_name: multi2vec-clip-djay
    environment:
      ENABLE_CUDA: '0'

  qna-transformers-djay:
    image: semitechnologies/qna-transformers:distilbert-base-uncased-distilled-squad
    container_name: qna-transformers-djay
    environment:
      ENABLE_CUDA: '0'

  sum-transformers-djay:
    image: semitechnologies/sum-transformers:facebook-bart-large-cnn-1.0.0
    container_name: sum-transformers-djay
    environment:
      ENABLE_CUDA: '0'

  text-spellcheck-djay:
    image: semitechnologies/text-spellcheck-model:pyspellchecker-en
    container_name: text-spellcheck-djay

  reranker-transformers-djay:
    image: semitechnologies/reranker-transformers:cross-encoder-ms-marco-MiniLM-L-6-v2
    container_name: reranker-transformers-djay
    environment:
      ENABLE_CUDA: '0'
