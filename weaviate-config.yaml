---
origin: http://localhost:8080
debug: false
log_level: info
log_format: text

persistence:
  data_path: /var/lib/weaviate

query_defaults:
  limit: 25

authentication:
  anonymous_access:
    enabled: true

authorization:
  admin_list:
    enabled: false

cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - "GET"
    - "POST" 
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "*"

cluster:
  hostname: weaviate-node
  gossip_bind_port: 7946
  data_bind_port: 7947
  join: []
  bootstrap_expect: 1

grpc:
  port: 9090

profiling:
  enabled: false

monitoring:
  enabled: false

modules:
  default_vectorizer_module: none
  modules: []
